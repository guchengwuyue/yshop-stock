<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>支付宝支付</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
body{font-family:sans-serif;text-align:center;padding:40px;background:#f5f5f5}
.box{background:#fff;display:inline-block;padding:24px 32px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
  <h3>支付宝支付</h3>
  <p id="qrcode"></p>
  <p>{$orderData.title|default=''} - {$orderData.amount|default=''}</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
  QRCode.toCanvas(document.createElement('canvas'), '{$payData.qr_code|default=""}', function(err, canvas){
    if(!err) document.getElementById('qrcode').appendChild(canvas);
  });
</script>
</body>
</html>
