<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>微信支付</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
body{font-family:sans-serif;text-align:center;padding:40px;background:#f5f5f5}
.box{background:#fff;display:inline-block;padding:24px 32px;border-radius:8px}
img{max-width:220px}
</style>
</head>
<body>
<div class="box">
  <h3>微信支付</h3>
  {if $type == 'pc'}
  <p id="qrcode"></p>
  <p>{$orderData.title|default=''} - {$orderData.amount|default=''}</p>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    QRCode.toCanvas(document.createElement('canvas'), '{$payData.code_url|default=""}', function(err, canvas){
      if(!err) document.getElementById('qrcode').appendChild(canvas);
    });
    setInterval(function(){
      fetch(location.href, {method:'POST', headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'}, body:'orderid={$orderData.orderid|default=""}'})
        .then(r=>r.json()).then(function(res){ if(res.data && res.data.status==='SUCCESS'){ location.reload(); }});
    }, 3000);
  </script>
  {else/}
  <p>JSAPI...</p>
  <script>
    function onBridgeReady(){
      WeixinJSBridge.invoke('getBrandWCPayRequest', {
        appId:'{$payData.appId|default=""}',
        timeStamp:'{$payData.timeStamp|default=""}',
        nonceStr:'{$payData.nonceStr|default=""}',
        package:'{$payData.package|default=""}',
        signType:'{$payData.signType|default="RSA"}',
        paySign:'{$payData.paySign|default=""}'
      });
    }
    if(typeof WeixinJSBridge==='undefined'){
      document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
    } else { onBridgeReady(); }
  </script>
  {/if}
</div>
</body>
</html>
