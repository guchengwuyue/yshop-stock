<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="插件打包" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-addons-package">
  <input type="hidden" id="addonName" value="{$info.name}"/>
  <div class="form-group"><label class="col-sm-3 control-label">标识：</label><div class="col-sm-8"><input class="form-control" value="{$info.name}" readonly></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">版本：</label><div class="col-sm-8"><input name="version" class="form-control" value="{$info.version}" required><span class="help-block">确认版本后打包为 zip</span></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"addondev/addons/package/"+$("#addonName").val(), $("#form-addons-package").serialize()); } }</script>
</body></html>
