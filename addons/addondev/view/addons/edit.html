<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="编辑插件" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-addons-edit">
  <div class="form-group"><label class="col-sm-3 control-label">标识：</label><div class="col-sm-8"><input name="name" class="form-control" value="{$info.name}" readonly></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">名称：</label><div class="col-sm-8"><input name="title" class="form-control" value="{$info.title}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">版本：</label><div class="col-sm-8"><input name="version" class="form-control" value="{$info.version}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">作者：</label><div class="col-sm-8"><input name="author" class="form-control" value="{$info.author}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">介绍：</label><div class="col-sm-8"><input name="intro" class="form-control" value="{$info.intro}"></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"addondev/addons/edit/"+$("[name=name]").val(), $("#form-addons-edit").serialize()); } }</script>
</body></html>
